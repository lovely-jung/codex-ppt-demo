<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hello, codex-ppt-demo!</title>
  <style>
    :root {
      color-scheme: light dark;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: #ffffff;
      text-align: center;
    }

    main {
      padding: 2.5rem 3rem;
      border-radius: 1rem;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(6px);
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.25);
    }

    h1 {
      margin: 0 0 0.5rem;
      font-size: 2.5rem;
    }

    p {
      margin: 0;
      font-size: 1.1rem;
      opacity: 0.85;
    }
  </style>
</head>
<body>
  <main>
    <h1>👋 Hello, world!</h1>
    <p>codex-ppt-demo &middot; deployed via GitHub Actions</p>
  </main>
</body>
</html>
