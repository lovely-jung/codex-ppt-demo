<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hello, codex-ppt-demo!</title>
  <style>
    :root {
      color-scheme: light dark;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #ff512f, #f09819);
      color: #ffffff;
      text-align: center;
    }

    main {
      padding: 3rem 4rem;
      border-radius: 1.25rem;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(6px);
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.3);
    }

    h1 {
      margin: 0 0 0.75rem;
      font-size: 5rem;
    }

    p {
      margin: 0;
      font-size: 1.5rem;
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <main>
    <h1>👋 Hello, world!</h1>
    <p>codex-ppt-demo &middot; deployed via GitHub Actions</p>
  </main>
</body>
</html>
